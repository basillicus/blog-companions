name: Release post zip

on:
  push:
    tags:
      - '*/v*'
  workflow_dispatch:
    inputs:
      folder:
        description: 'Post folder name (e.g. 2026-11-pdf-parsing)'
        required: true
        type: string
      version:
        description: 'Version suffix (e.g. v1, v2)'
        required: true
        default: 'v1'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate folder and resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_FOLDER: ${{ inputs.folder }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DIR="${INPUT_FOLDER%/}"
            VER="$INPUT_VERSION"
            if [[ ! "$VER" =~ ^v[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
              echo "::error::Invalid version '$VER'. Expected something like v1 or v2."
              exit 1
            fi
            TAG="${DIR}/${VER}"
          else
            TAG="$REF_NAME"
            DIR="${TAG%/v*}"
          fi

          if [[ ! "$DIR" =~ ^[0-9]{4}-[0-9]{2}-[a-z0-9-]+$ ]]; then
            echo "::error::Invalid folder name '$DIR'. Expected YYYY-MM-slug."
            exit 1
          fi

          if [ ! -d "$DIR" ]; then
            echo "::error::Folder '$DIR' does not exist."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=${DIR}.zip" >> "$GITHUB_OUTPUT"

      - name: Build post zip
        env:
          DIR: ${{ steps.meta.outputs.dir }}
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
        run: |
          STAGE="$(mktemp -d)"
          cp -a "$DIR" "$STAGE/$DIR"
          if [ ! -f "$STAGE/$DIR/LICENSE" ] && [ -f "LICENSE" ]; then
            cp LICENSE "$STAGE/$DIR/LICENSE"
          fi
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" "$DIR" -x '*/__pycache__/*' '*/.DS_Store')
          rm -rf "$STAGE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.dir }} (${{ steps.meta.outputs.tag }})"
          files: ${{ steps.meta.outputs.zip }}
          body: |
            Companion code snapshot for [`${{ steps.meta.outputs.dir }}`](https://github.com/${{ github.repository }}/tree/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.dir }}).

            Download `${{ steps.meta.outputs.zip }}` below for just this article's files.
