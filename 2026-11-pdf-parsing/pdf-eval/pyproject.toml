[project]
name = "pdf-eval"
version = "0.1.0"
description = "Score PDF-to-Markdown parser output against ground truth (opendataloader-bench metrics plus extensions)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "apted>=1.0.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf-eval = "pdf_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
